name: Stage npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version already committed on main, e.g. 1.0.0'
        required: true
        type: string
      stage:
        description: 'Publish the validated tarball to npm via OIDC (false = rehearsal only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-release-stage
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      filename: ${{ steps.identity.outputs.filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - name: Require main, unpublished version and successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-github.mjs preflight "$RELEASE_VERSION"
      - run: npm ci --ignore-scripts
      - run: npm run build:node
      - name: Build and audit the only release tarball
        run: node scripts/release-candidate.mjs prepare "$RUNNER_TEMP/candidate"
      - id: identity
        name: Bind candidate to this workflow run
        run: node scripts/release-github.mjs bind "$RUNNER_TEMP/candidate" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate/candidate.json
            ${{ runner.temp }}/candidate/*.tgz
          if-no-files-found: error
          retention-days: 30

  install:
    needs: candidate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '26']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Test installed aliases, configuration and MCP with confirmed shutdown
        run: node scripts/release-install.mjs "$RUNNER_TEMP/candidate"

  stage:
    needs: [candidate, install]
    if: ${{ inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Verify the exact artifact again without rebuilding
        run: node scripts/release-github.mjs bind "$RUNNER_TEMP/candidate" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"
      - name: Publish the exact audited artifact via OIDC
        env:
          CANDIDATE_FILE: ${{ needs.candidate.outputs.filename }}
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
        run: npm publish "$RUNNER_TEMP/candidate/$CANDIDATE_FILE" --ignore-scripts --access public --tag latest --registry=https://registry.npmjs.org/
      - name: Publish complete
        run: |
          {
            echo '## npm publish completed'
            echo 'The audited tarball bytes tested by this run are now live on the registry.'
            echo "Verify candidate.json hashes against the registry, then run Finalize npm release with source_run_id=$GITHUB_RUN_ID. Do not rerun staging to finish a release."
          } >> "$GITHUB_STEP_SUMMARY"
