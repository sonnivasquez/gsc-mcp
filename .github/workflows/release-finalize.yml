name: Finalize npm release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful Stage npm release run ID, after approving its package in npm'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-release-finalize
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run-id: ${{ steps.origin.outputs.run-id }}
      run-attempt: ${{ steps.origin.outputs.run-attempt }}
      source-sha: ${{ steps.origin.outputs.source-sha }}
      artifact-name: ${{ steps.origin.outputs.artifact-name }}
      sha256: ${{ steps.binding.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Only main can finalize
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - name: Validate successful stage run, attempt, workflow and ancestry
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
        run: node scripts/release-github.mjs origin "$SOURCE_RUN"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.origin.outputs.run-id }}
          name: ${{ steps.origin.outputs.artifact-name }}
          path: ${{ runner.temp }}/candidate
      - name: Verify artifact identity
        id: binding
        env:
          SOURCE_RUN: ${{ steps.origin.outputs.run-id }}
          SOURCE_ATTEMPT: ${{ steps.origin.outputs.run-attempt }}
          SOURCE_SHA: ${{ steps.origin.outputs.source-sha }}
        run: node scripts/release-github.mjs bind "$RUNNER_TEMP/candidate" "$SOURCE_RUN" "$SOURCE_ATTEMPT" "$SOURCE_SHA"
      - name: Require the approved bytes to be available from npm
        run: node scripts/release-candidate.mjs registry "$RUNNER_TEMP/candidate"
      - run: npm ci --ignore-scripts
      - name: Verify installed behavior of the same bytes
        run: node scripts/release-install.mjs "$RUNNER_TEMP/candidate"

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify.outputs.run-id }}
          name: ${{ needs.verify.outputs.artifact-name }}
          path: ${{ runner.temp }}/candidate
      - name: Bind again before granting release writes
        id: binding
        env:
          SOURCE_RUN: ${{ needs.verify.outputs.run-id }}
          SOURCE_ATTEMPT: ${{ needs.verify.outputs.run-attempt }}
          SOURCE_SHA: ${{ needs.verify.outputs.source-sha }}
        run: node scripts/release-github.mjs bind "$RUNNER_TEMP/candidate" "$SOURCE_RUN" "$SOURCE_ATTEMPT" "$SOURCE_SHA"
      - name: Require the hash verified by the unprivileged install job
        env:
          EXPECTED: ${{ needs.verify.outputs.sha256 }}
          ACTUAL: ${{ steps.binding.outputs.sha256 }}
        run: test "$EXPECTED" = "$ACTUAL"
      - name: Create or safely resume GitHub release, without republishing npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-finalize.mjs finalize "$RUNNER_TEMP/candidate"
      - name: Deployment reminder
        run: |
          {
            echo '## npm and GitHub release verified'
            echo 'Repository visibility is unchanged. Deploy the matching website separately using its existing authorized Cloudflare procedure; this job has no Cloudflare credentials.'
          } >> "$GITHUB_STEP_SUMMARY"
